<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blooming Flower</title>
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f8ff; margin: 0;">
  <div style="position: relative; width: 100px; height: 100px;">
    <!-- Petals -->
    <div style="position: absolute; width: 50px; height: 50px; background: pink; border-radius: 50%; top: 0; left: 25%;"></div>
    <div style="position: absolute; width: 50px; height: 50px; background: pink; border-radius: 50%; top: 25%; right: 0;"></div>
    <div style="position: absolute; width: 50px; height: 50px; background: pink; border-radius: 50%; bottom: 0; left: 25%;"></div>
    <div style="position: absolute; width: 50px; height: 50px; background: pink; border-radius: 50%; top: 25%; left: 0;"></div>
    <!-- Center -->
    <div style="position: absolute; width: 40px; height: 40px; background: yellow; border-radius: 50%; top: 30%; left: 30%;"></div>
  </div>
</body>
</html>
